[package]
name = "wooting-glance"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "AI activity on your Wooting light bar"
repository = "https://github.com/samctensen/wooting-glance"
publish = false

[[bin]]
name = "glance"
path = "src/main.rs"

[dependencies]
anyhow = "1"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
ctrlc = { version = "3.4", features = ["termination"] }
hidapi = { version = "2.6.7", features = ["macos-shared-device"] }
